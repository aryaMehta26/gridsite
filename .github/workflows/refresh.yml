name: weekly-refresh

on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Rebuild scores, map, and charts
        run: python -m gridsite run --regions bay_area stockton
      - name: Commit refreshed outputs
        run: |
          git config user.name "gridsite-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/processed docs
          git diff --cached --quiet || git commit -m "weekly data refresh"
          git push
